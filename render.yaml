services:
  - type: web
    name: day-19-loan-default
    runtime: python
    rootDir: day-19-project-own
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT

  - type: web
    name: loan-approval-api
    runtime: python
    rootDir: project/loan_approval_fullstack-main
    buildCommand: pip install -r backend/requirements.txt && python loan.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT

  - type: web
    name: loan-approval-frontend
    runtime: python
    rootDir: project/loan_approval_fullstack-main
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: loan-approval-api
          property: host